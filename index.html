<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE | پنل کاربر</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{
 --bg:#06101f;--bg2:#08172c;--panel:#0b1b33;--panel2:#0d203b;
 --line:rgba(126,157,202,.16);--text:#edf5ff;--muted:#8fa3c2;
 --teal:#28c7c4;--cyan:#38b7ff;--blue:#4169ff;--purple:#8a63ff;
 --gold:#d8a947;--green:#62d892;--red:#ff6e85;--shadow:0 14px 38px rgba(0,0,0,.28)
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:
 radial-gradient(circle at 10% 10%,rgba(38,199,196,.09),transparent 26%),
 radial-gradient(circle at 86% 5%,rgba(65,105,255,.11),transparent 27%),var(--bg);
 color:var(--text)}
.app{min-height:100vh;display:flex}
.sidebar{width:285px;position:fixed;right:0;top:0;bottom:0;padding:18px 14px;overflow:auto;background:linear-gradient(180deg,#071426,#09172c 62%,#0a1630);border-left:1px solid var(--line);z-index:10}
.brand{padding:9px;border-radius:18px;background:linear-gradient(135deg,#eef5f5,#fff);box-shadow:0 10px 30px rgba(0,0,0,.28);margin-bottom:16px}
.brand img{width:100%;height:92px;object-fit:contain;display:block}
.userbox{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,rgba(20,45,79,.88),rgba(9,26,49,.88))}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--purple));font-weight:900;color:white}
.userbox b{font-size:13px}.userbox small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#c8d6eb;padding:11px 12px;border-radius:12px;text-align:right;font:700 12px Vazirmatn;cursor:pointer;display:flex;align-items:center;gap:11px;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(42,199,196,.55),rgba(61,102,255,.7));box-shadow:0 8px 24px rgba(42,115,255,.17)}
.icon{font-size:17px;width:23px;text-align:center}.nav .text{flex:1}
.side-bottom{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(10,28,51,.8);font-size:10px;color:var(--muted);line-height:1.9}
.main{margin-right:285px;width:calc(100% - 285px);padding:18px 22px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.welcome{display:flex;gap:12px;align-items:center}.welcome .wave{font-size:27px}.welcome h2{margin:0;font-size:21px}.welcome p{margin:3px 0 0;color:var(--muted);font-size:11px}
.actions{display:flex;gap:8px;align-items:center}.tiny{border:1px solid var(--line);background:rgba(12,29,53,.85);color:#cddaf0;border-radius:12px;padding:10px 12px;font:700 11px Vazirmatn}
.badge{position:relative}.dot{position:absolute;top:-5px;left:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:9px;color:white}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:18px 0}.page-head h1{font-size:24px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;color:white;font:800 12px Vazirmatn;cursor:pointer;background:linear-gradient(135deg,#167ecb,var(--blue));box-shadow:0 8px 22px rgba(49,105,255,.22)}
.btn.secondary{background:transparent;border:1px solid rgba(42,199,196,.45);color:#8be6e1}.btn.gold{background:linear-gradient(135deg,#8a681c,#d6a63e)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{background:linear-gradient(145deg,rgba(13,32,59,.96),rgba(8,24,45,.96));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.metric .label{font-size:11px;color:var(--muted)}.metric .num{font-size:28px;font-weight:900;margin:8px 0 3px}.metric .hint{font-size:10px;color:var(--green)}.metric .hint.warn{color:#e9c268}.metric .hint.red{color:#ff8093}
.section{margin-top:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3,.card h3{font-size:15px;margin:0}.section-title span{font-size:10px;color:var(--muted)}
.ring{width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--teal) 0 87%,var(--blue) 87% 92%,rgba(255,255,255,.08) 92%);display:grid;place-items:center;position:relative;flex:none}.ring:after{content:"";width:88px;height:88px;border-radius:50%;background:#091a32;position:absolute}.ring b{z-index:1;font-size:28px}
.readiness{display:flex;align-items:center;gap:18px}.muted{color:var(--muted);font-size:11px;line-height:1.9}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;background:rgba(98,216,146,.13);color:#79e5a5}.pill.warn{background:rgba(216,169,71,.13);color:#e5bd64}.pill.red{background:rgba(255,110,133,.12);color:#ff91a2}.pill.blue{background:rgba(65,105,255,.14);color:#91a9ff}
.list{display:grid;gap:0}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1}.row b{font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.miniicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(65,105,255,.22),rgba(138,99,255,.18));color:#9eb4ff}
.opportunity{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(4,15,29,.2);margin-bottom:10px}.opportunity:last-child{margin-bottom:0}.op-top{display:flex;justify-content:space-between;gap:10px}.opportunity b{font-size:13px}.opportunity p{font-size:11px;color:var(--muted);line-height:1.9}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:#aabbd2;font-size:9px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid var(--line);background:rgba(255,255,255,.025);color:#dce7f6;border-radius:14px;padding:16px 8px;font:700 11px Vazirmatn;cursor:pointer}.quick .qicon{font-size:23px;display:block;margin-bottom:7px;color:#9a8cff}
.progress{height:7px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),var(--blue))}
.skill{padding:12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line)}.skill b{font-size:11px;display:block;margin-bottom:8px}.skill small{color:var(--muted);font-size:9px}
.notice{padding:12px;border-radius:13px;background:rgba(216,169,71,.08);border:1px solid rgba(216,169,71,.2);font-size:11px;color:#e8cf91;line-height:1.9}
.timeline{display:flex;align-items:flex-start;gap:8px;overflow:auto;padding-bottom:4px}.stage{min-width:112px;text-align:center}.stage .bubble{width:46px;height:46px;border-radius:50%;margin:auto;display:grid;place-items:center;background:rgba(65,105,255,.16);border:1px solid rgba(102,132,255,.35);color:#aebdff}.stage.done .bubble{background:rgba(98,216,146,.15);color:#80e6a9;border-color:rgba(98,216,146,.3)}.stage.gold .bubble{background:rgba(216,169,71,.15);color:#e5c46f}.stage b{display:block;font-size:10px;margin-top:8px}.stage small{color:var(--muted);font-size:9px}.arrow{color:#58719a;margin-top:15px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;font-size:12px}
.form{display:grid;gap:10px}.field{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);color:#dbe8f7;font:12px Vazirmatn}.switchrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:22px;bottom:22px;background:#10243f;border:1px solid rgba(42,199,196,.3);color:#dffdfa;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow);transform:translateY(120px);transition:.25s;z-index:30;font-size:12px}.toast.show{transform:translateY(0)}

/* مدل‌های دسترسی کاربر */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.plan-card{position:relative;padding:18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(13,32,59,.98),rgba(8,24,45,.98));box-shadow:var(--shadow);overflow:hidden}
.plan-card:before{content:"";position:absolute;right:0;left:0;top:0;height:4px;background:var(--green)}
.plan-card.plus:before{background:var(--blue)}.plan-card.pro:before{background:var(--purple)}
.plan-card.active-plan{border-color:rgba(42,199,196,.55);box-shadow:0 18px 42px rgba(40,199,196,.12)}
.plan-card .plan-name{font-size:20px;font-weight:900;margin-bottom:7px}
.plan-card .plan-price{font-size:22px;font-weight:900;margin:8px 0}
.plan-card .plan-price small{font-size:10px;color:var(--muted);font-weight:500}
.plan-card ul{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.plan-card li{font-size:11px;color:#cbd8eb;line-height:1.8}
.plan-card li:before{content:"✓";margin-left:7px;color:var(--green);font-weight:900}
.plan-card .plan-desc{font-size:11px;color:var(--muted);line-height:1.9;min-height:42px}
.plan-actions{display:flex;gap:8px;margin-top:14px}
.plan-actions .btn{flex:1}
.feature-lock{margin-top:12px;padding:13px;border-radius:14px;background:rgba(138,99,255,.08);border:1px dashed rgba(138,99,255,.42);font-size:11px;color:#d7c9ff;line-height:1.9}
.feature-ok{margin-top:12px;padding:13px;border-radius:14px;background:rgba(98,216,146,.07);border:1px solid rgba(98,216,146,.18);font-size:11px;color:#bcebd0;line-height:1.9}
.plan-status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line);margin-bottom:14px}
.plan-status b{font-size:12px}.plan-status span{font-size:10px;color:var(--muted)}
@media(max-width:900px){.plan-grid{grid-template-columns:1fr}}

@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.sidebar{width:240px}.main{margin-right:240px;width:calc(100% - 240px)}}@media(max-width:760px){.sidebar{position:static;width:100%;max-height:none}.app{display:block}.main{margin:0;width:100%;padding:12px}.grid4,.grid3,.grid2{grid-template-columns:1fr}.topbar,.page-head{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:repeat(2,1fr)}.nav button{font-size:10px}.side-bottom{display:none}}
</style>
</head>

<script>
const state={page:'home',plan:'simple',favorite:['پوشش شیفت عصر اورژانس']};
const planInfo={
 simple:{name:'SIMPLE',label:'🟢 SIMPLE',desc:'رایگان',color:'var(--green)'},
 plus:{name:'PLUS',label:'🔵 PLUS',desc:'امکانات هوشمند فرصت‌ها',color:'var(--blue)'},
 pro:{name:'PRO',label:'🟣 PRO',desc:'بهینه‌سازی مسیر حرفه‌ای',color:'var(--purple)'}
};
function hasPlan(level){
 const rank={simple:1,plus:2,pro:3};
 return rank[state.plan]>=rank[level];
}
function selectPlan(plan){
 state.plan=plan;
 showToast('طرح '+planInfo[plan].label+' در نسخه نمایشی فعال شد.');
 render();
}
function planGate(level,title,desc){
 if(hasPlan(level)) return `<div class="feature-ok"><b>✓ ${title}</b><br>${desc}</div>`;
 const needed=level==='plus'?'PLUS یا PRO':'PRO';
 return `<div class="feature-lock"><b>🔒 ${title}</b><br>${desc}<br><button class="btn secondary" style="margin-top:10px" onclick="go('plans')">مشاهده و انتخاب ${needed}</button></div>`;
}
const metric=(n,l,h='',c='')=>`<div class="card metric"><div class="label">${l}</div><div class="num">${n}</div><div class="hint ${c}">${h}</div></div>`;
const head=(t,s,btn='')=>`<div class="page-head"><div><h1>${t}</h1><p>${s}</p></div>${btn?`<button class="btn" onclick="${btn.action||''}">${btn.label}</button>`:''}</div>`;
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function home(){const advanced=hasPlan('plus'), pro=hasPlan('pro'); return head('داشبورد من','نمایی یکپارچه از وضعیت حرفه‌ای، برنامه کاری و فرصت‌های پیشنهادی شما')+
`<div class="plan-status"><div><b>طرح فعال شما: ${planInfo[state.plan].label}</b><span> · ${planInfo[state.plan].desc}</span></div><button class="btn secondary" onclick="go('plans')">تغییر طرح</button></div>
<div class="grid4">${metric('۹۲','امتیاز حرفه‌ای',pro?'تحلیل کامل مسیر حرفه‌ای':'در طرح PRO تحلیل پیشرفته فعال می‌شود')}${metric('۸۹','تجربه کاری','امتیاز سابقه و نقش‌های ثبت‌شده')}${metric(advanced?'۹۱':'پایه','آمادگی و ظرفیت کاری',advanced?'مدیریت پیشرفته ظرفیت فعال است':'مدیریت پیشرفته در PLUS فعال می‌شود')}${metric('۸۷٪','تکمیل پروفایل','اطلاعات حرفه‌ای شما')}</div>
<div class="section grid2">
 <div class="card"><div class="section-title"><h3>امتیاز حرفه‌ای شما</h3><span>به‌روزرسانی امروز</span></div><div class="readiness"><div class="ring"><b>۹۲</b></div><div><b>سطح حرفه‌ای عالی</b><p class="muted">امتیاز شما از مهارت‌ها، تجربه کاری، آموزش‌ها و ارزیابی‌ها ساخته می‌شود و با داده‌های مدیریتی PULSE هم‌راستاست.</p><span class="pill">آماده فرصت‌های تخصصی</span></div></div></div>
 <div class="card"><div class="section-title"><h3>میان‌برهای سریع</h3><span>دسترسی سریع</span></div><div class="quick"><button onclick="go('profile')"><span class="qicon">✎</span>ویرایش پروفایل</button><button onclick="go('schedule')"><span class="qicon">◷</span>برنامه کاری</button><button onclick="go('trainings')"><span class="qicon">▣</span>دوره‌های آموزشی</button><button onclick="go('assessments')"><span class="qicon">✓</span>آزمون‌ها و بازخورد</button></div></div>
</div>
<div class="section grid2">

 ${opp('پوشش شیفت عصر اورژانس','۹۲٪ تطبیق','بیمارستان تخصصی قلب شیراز','امروز · ۸ ساعت')}
 ${opp('پرستار بخش ICU','۹۴٪ تطبیق','بیمارستان مهر','تمام وقت')}
 ${opp('پرستار اورژانس','۹۲٪ تطبیق','بیمارستان مرکزی','شیفت شب')}

 ${skillRow('مراقبت‌های ویژه (ICU)',93)}${skillRow('احیای قلبی (ACLS)',91)}${skillRow('ونتیلاتور و دستگاه‌های تنفسی',86)}${skillRow('مدیریت بحران و تریاژ',83)}${skillRow('مراقبت از بیمار بدحال',80)}</div>
</div>
<div class="section grid2">
 <div class="card"><div class="section-title"><h3>تکمیل پروفایل</h3><span>۸۷٪ کامل</span></div><div class="readiness"><div class="ring" style="background:conic-gradient(var(--cyan) 0 87%,rgba(255,255,255,.08) 87%)"><b>۸۷٪</b></div><div><b>فقط چند قدم تا پروفایل کامل</b><p class="muted">برای افزایش دقت پیشنهادها، گواهی BLS و ظرفیت هفتگی را به‌روزرسانی کنید.</p><button class="btn secondary" onclick="go('profile')">تکمیل پروفایل</button></div></div></div>

</div>
<div class="section grid2">
 <div class="card"><div class="section-title"><h3>امکانات فرصت‌یابی شما</h3><span>${hasPlan('plus')?'هوشمند فعال':'نسخه پایه'}</span></div>
 ${hasPlan('plus')?`<div class="feature-ok"><b>✓ تطبیق هوشمند فرصت‌ها فعال است</b><br>امتیاز تطبیق، پیشنهادهای شخصی، فیلتر هوشمند، پیشنهاد بر اساس موقعیت، مدیریت ظرفیت، مدیریت پیشرفته درخواست‌ها و تخمین درآمد برای شما در دسترس است.</div>`:planGate('plus','تطبیق هوشمند فرصت‌ها','در طرح SIMPLE جست‌وجو و مشاهده فرصت‌ها فعال است. برای اینکه PULSE خودش فرصت مناسب شما را پیدا و رتبه‌بندی کند، PLUS را انتخاب کنید.')}
 </div>
 <div class="card"><div class="section-title"><h3>مسیر حرفه‌ای هوشمند</h3><span>${hasPlan('pro')?'تحلیل پیشرفته فعال':'قفل در SIMPLE / PLUS'}</span></div>
 ${hasPlan('pro')?`<div class="feature-ok"><b>✓ دستیار هوشمند مسیر حرفه‌ای فعال است</b><br>تحلیل شکاف مهارتی، پیشنهاد رشد شغلی، پیشنهاد مسیر حرفه‌ای، بهینه‌سازی درآمد، تحلیل فشار کاری، امتیاز حرفه‌ای، آمادگی بحران و پیشنهاد مهارت‌های موردنیاز بازار.</div>`:planGate('pro','بهینه‌سازی مسیر حرفه‌ای','PULSE در طرح PRO فقط فرصت پیدا نمی‌کند، بلکه مسیر حرفه‌ای شما را نیز تحلیل و بهینه می‌کند.')}
 </div>
</div><div class="section card"><div class="section-title"><h3>مسیر رشد حرفه‌ای پیشنهادی برای شما</h3><span>بر اساس داده‌های فعلی پروفایل</span></div><div class="timeline"><div class="stage done"><div class="bubble">✓</div><b>مرحله ۱</b><small>پرستار بخش</small></div><span class="arrow">←</span><div class="stage done"><div class="bubble">✓</div><b>مرحله ۲</b><small>پرستار با تجربه</small></div><span class="arrow">←</span><div class="stage"><div class="bubble">♟</div><b>مرحله ۳</b><small>سرپرستار</small></div><span class="arrow">←</span><div class="stage"><div class="bubble">◈</div><b>مرحله ۴</b><small>مدیر بخش</small></div><span class="arrow">←</span><div class="stage gold"><div class="bubble">☆</div><b>مرحله ۵</b><small>مدیر ارشد پرستاری</small></div></div></div>`}
function opp(t,m,p,meta){return `<div class="opportunity"><div class="op-top"><b>${t}</b><span class="pill">${m}</span></div><p>${p} · ${meta}</p><div class="tags"><span class="tag">پیشنهاد هوشمند</span><span class="tag">نیروی سلامت</span></div></div>`}

`<div class="grid3">${metric('۳','شیفت این هفته','۲ شیفت تأییدشده')}${metric('۱۲ ساعت','ظرفیت آزاد','برای فرصت‌های پیشنهادی')}${metric('۲','درخواست فعال','در انتظار پاسخ','warn')}</div>

${shift('امروز · ۱۴ تا ۲۲','مراقبت ویژه','شیفت عصر · تأیید شده')}
${shift('فردا · ۰۸ تا ۱۶','آمادگی برای فرصت اورژانس','ظرفیت پیشنهادی PULSE')}
${shift('شنبه · ۰۸ تا ۱۶','بخش ICU','شیفت روز')}
${shift('دوشنبه · ۱۶ تا ۲۴','ظرفیت آزاد','قابل تخصیص')}</div></div>
<div class="card"><h3>ظرفیت و ترجیحات کاری</h3><p class="muted">اطلاعات این بخش مستقیماً در رتبه‌بندی فرصت‌های پیشنهادی و نمای مدیریتی سازمان اثر می‌گذارد.</p><div style="margin-top:18px">${skillRow('ظرفیت ثبت‌شده هفته',60)}${skillRow('انعطاف‌پذیری شیفت',91)}</div><button class="btn" style="margin-top:14px" onclick="showToast('پنجره ویرایش ظرفیت در نسخه نمایشی فعال شد.')">ویرایش ظرفیت</button></div></div>`}
function shift(a,b,c){return `<div class="row"><div class="miniicon">◷</div><div class="grow"><b>${b}</b><small>${a} · ${c}</small></div><span class="pill">${c.includes('تأیید')?'تأیید':'فعال'}</span></div>`}
function opportunities(){const smart=hasPlan('plus');return head('فرصت‌های پیشنهادی',smart?'فرصت‌ها با تطبیق هوشمند، ظرفیت و ترجیحات شما رتبه‌بندی شده‌اند':'در SIMPLE می‌توانید فرصت‌ها را جست‌وجو و مشاهده کنید. تطبیق هوشمند در PLUS فعال می‌شود.')+
`<div class="section grid2"><div class="card">
${opp('پرستار بخش ICU',smart?'۹۴٪ تطبیق':'فرصت پایه','بیمارستان مهر · شیراز',smart?'تمام وقت · تخمین درآمد فعال':'تمام وقت')}
${opp('پوشش شیفت عصر اورژانس',smart?'۹۲٪ تطبیق':'فرصت پایه','بیمارستان تخصصی قلب شیراز','امروز · ۸ ساعت')}
${opp('پرستار اورژانس',smart?'۹۲٪ تطبیق':'فرصت پایه','بیمارستان مرکزی','شیفت شب')}
${smart?opp('سرپرستار بخش','۸۴٪ تطبیق','مرکز درمانی سپید','پیشنهاد هوشمند مسیر شغلی'):''}
${!smart?planGate('plus','تطبیق هوشمند و امتیاز تطبیق','با PLUS، PULSE فرصت‌ها را بر اساس مهارت، سابقه، موقعیت، ظرفیت و ترجیحات شما رتبه‌بندی می‌کند.'):''}</div>
<div class="card"><h3>چرا این پیشنهادها را می‌بینید؟</h3><p class="muted">PULSE از ۱۲ مهارت تأییدشده، ۹۱٪ شاخص انعطاف‌پذیری، ۸۹ امتیاز تجربه کاری و ظرفیت ثبت‌شده شما برای رتبه‌بندی استفاده می‌کند.</p><div class="notice" style="margin-top:14px">با تکمیل پروفایل از ۸۷٪ به ۱۰۰٪، دقت تطبیق فرصت‌ها افزایش پیدا می‌کند.</div></div></div>`}

`<div class="section grid2"><div class="card"><div class="row"><div class="avatar" style="width:62px;height:62px;font-size:24px">م</div><div class="grow"><b style="font-size:17px">مریم احمدی</b><small>پرستار ICU · بیمارستان امام رضا (ع) شیراز</small><small>کد پرسنلی: ۲۵۶۸۹</small></div><span class="pill blue">تأییدشده</span></div>
<div class="section-title" style="margin-top:18px"><h3>اطلاعات حرفه‌ای</h3><span>به‌روز</span></div><div class="list"><div class="row"><div class="grow"><b>سابقه حرفه‌ای</b><small>۸ سال تجربه در مراقبت‌های ویژه و اورژانس</small></div></div><div class="row"><div class="grow"><b>تحصیلات</b><small>کارشناسی پرستاری</small></div></div><div class="row"><div class="grow"><b>وضعیت کاری</b><small>شاغل · آماده بررسی فرصت‌های منتخب</small></div></div></div></div>

function skills(){return head('مهارت‌ها و گواهی‌نامه‌ها','مهارت‌های تأییدشده و مدارک حرفه‌ای که مبنای تطبیق فرصت‌ها هستند')+

const pages={home,schedule,opportunities,profile,skills,trainings,assessments,notifications,favorites,support,plans,settings};
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('content').innerHTML=pages[state.page]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.page)});
render();
